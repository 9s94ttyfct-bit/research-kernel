[project]
name = "rk"
version = "0.1.0"
description = "Research Kernel: verifiable autonomous research agent foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "pypdfium2>=5.14,<6",
    "trafilatura>=2.3,<3",
    "lxml>=6,<7",
    "rapidfuzz>=3.14,<4",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "typer>=0.27,<1",
    "python-ulid>=4.1,<5",
    "tomli-w>=1.2,<2",
    "bibtexparser>=2.0.0b8,<3",
    "rispy>=0.10,<1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
# V-SUPPORT layer 1 (MiniCheck-Flan-T5-Large, local, MPS on Apple Silicon)
support = [
    "torch>=2.15,<3",
    "transformers>=5.22,<6",
    "nltk>=3.9,<4",
    "sentencepiece>=0.2,<1",
]
# evaluation datasets distributed as parquet (LitQA2)
eval = ["pyarrow>=20"]

[project.scripts]
rk = "rk.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "respx>=0.23,<1",
    "fpdf2>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real network",
    "llm: calls a language model (default test model: omp_gateway openai-codex/gpt-6-luna)",
    "model: loads the local MiniCheck model (needs the 'support' extra; downloads ~3 GB once)",
]
addopts = "-m 'not live and not llm and not model' -q"
