<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Kernel — Workbench</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script type="module" src="/ui/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/projects">Research Kernel</a>
    <label class="project-switch">Project
      <select id="project-select" aria-label="Current project"></select>
    </label>
    <span id="browser-state" class="browser-state" role="status" aria-live="polite">Browser: checking…</span>
  </header>
  <nav class="rail" aria-label="Workbench pages">
    <a href="#/chat" data-page="chat">Chat</a>
    <a href="#/library" data-page="library">Library</a>
    <a href="#/checkpoints" data-page="checkpoints">Checkpoints <span id="open-count" class="count" hidden></span></a>
    <a href="#/progress" data-page="progress">Progress</a>
    <a href="#/drafts" data-page="drafts">Drafts</a>
    <a href="#/projects" data-page="projects">Projects</a>
    <a href="#/settings" data-page="settings">Settings</a>
  </nav>
  <main id="page" tabindex="-1">Loading the Workbench…</main>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
