# Model developer ("vendor") per driver, spec §8.1. Rules are tried in order; `match` is an fnmatch pattern
# against "<provider>:<model>" (a driver without a model is matched as "<provider>:").
# A driver that matches no rule has an unknown vendor and can never act as a reviewer.
rules = [
  { match = "claude_cli:*",               vendor = "anthropic" },
  { match = "anthropic_api:*",            vendor = "anthropic" },
  { match = "omp_gateway:anthropic/*",    vendor = "anthropic" },
  { match = "codex_cli:*",                vendor = "openai" },
  { match = "openai_api:*",               vendor = "openai" },
  { match = "omp_gateway:openai-codex/*", vendor = "openai" },
  { match = "omp_gateway:openai/*",       vendor = "openai" },
  { match = "human:*",                    vendor = "human" },
]

# Model families, tried after `rules` and failing closed (an unknown vendor can never review; a wrong one could):
# `match` is an fnmatch pattern against the model id, the part after the last "/".
# - ollama:<id>: only library ids, without "/" (ollama:glm-5:cloud -> "glm-5:cloud"); a namespaced upload
#   (ollama:someuser/claude-3-distill) is unknown.
# - omp_gateway:<host>/<id>: only on the `family_hosts`, which serve first-party or library models
#   (omp_gateway:ollama-cloud/kimi-k3 -> "kimi-k3"); any other host is unknown.
# - omp_gateway:<host>/<org>/<id>: the org must be one of the family vendor's `vendor_orgs`
#   (omp_gateway:openrouter/deepseek-ai/deepseek-v3.2 -> deepseek; …/someuser/deepseek-merge -> unknown).
# - omp_gateway:<id> without a host is unknown. The o-series (o1, o4-mini) is known only through the openai hosts'
#   explicit rules above.
families = [
  { match = "claude*",   vendor = "anthropic" },
  { match = "gpt-[0-9]*", vendor = "openai" },
  { match = "gpt[0-9]*", vendor = "openai" },
  { match = "gpt-oss*",  vendor = "openai" },
  { match = "codex*",    vendor = "openai" },
  { match = "deepseek*", vendor = "deepseek" },
  { match = "gemini*",   vendor = "google" },
  { match = "gemma*",    vendor = "google" },
  { match = "qwen*",     vendor = "alibaba" },
  { match = "llama*",    vendor = "meta" },
  { match = "mistral*",  vendor = "mistral" },
  { match = "kimi*",     vendor = "moonshot" },
  { match = "glm*",      vendor = "zhipu" },
  { match = "minimax*",  vendor = "minimax" },
]
family_hosts = ["anthropic", "openai", "openai-codex", "ollama-cloud", "ollama"]

[vendor_orgs]
anthropic = ["anthropic"]
openai = ["openai"]
deepseek = ["deepseek", "deepseek-ai"]
google = ["google"]
alibaba = ["qwen", "alibaba"]
meta = ["meta", "meta-llama"]
mistral = ["mistralai"]
moonshot = ["moonshotai"]
zhipu = ["zhipuai", "thudm"]
minimax = ["minimax"]
